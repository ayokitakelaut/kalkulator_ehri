name: Gate XRP Futures

on:
  schedule:
    - cron: "*/5 * * * *"

  workflow_dispatch:

jobs:
  run:

    runs-on: ubuntu-latest

    steps:

      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install -r requirements.txt

      - run: python bot.py
        env:
          GATE_KEY: ${{ secrets.GATE_KEY }}
          GATE_SECRET: ${{ secrets.GATE_SECRET }}
