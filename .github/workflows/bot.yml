name: Gate XRP Bot

on:

  workflow_dispatch:

  schedule:
    - cron: '*/5 * * * *'

jobs:

  trade:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: pip install -r requirements.txt

      - name: Run Bot
        env:
          GATE_KEY: ${{ secrets.GATE_KEY }}
          GATE_SECRET: ${{ secrets.GATE_SECRET }}

        run: python bot.py
